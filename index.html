<!DOCTYPE html>
<html lang="zh-HK" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>個人記帳系統｜專業升級版</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } }
        }
      }
    };
  </script>

  <!-- FontAwesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Chart.js 圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK (Compat 模式) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <!-- ExcelJS 與 FileSaver -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; transition: background-color 0.3s, color 0.3s; }

    /* ★ 新增：月曆及矩陣樣式 ★ */
    .cal-day {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      background: transparent;
      transition: background 0.2s;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.75rem;
      position: relative;
    }
    .cal-day:hover { background: #e0e7ff; }
    .dark .cal-day:hover { background: #1e293b; }
    .cal-day.has-record { background: #d1fae5; color: #065f46; }
    .dark .cal-day.has-record { background: #064e3b; color: #6ee7b7; }
    .cal-day .day-label { font-weight: 700; }
    .cal-day .day-total { font-size: 0.5rem; opacity: 0.8; }

    .matrix-cell input {
      width: 100%;
      min-width: 50px;
      padding: 2px 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: white;
      font-size: 0.7rem;
      text-align: right;
    }
    .dark .matrix-cell input {
      background: #1e293b;
      border-color: #475569;
      color: white;
    }
    .matrix-cell input:focus { outline: 2px solid #6366f1; }

    .day-editor-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .day-editor-row select { flex: 2; }
    .day-editor-row input[type="number"] { flex: 1; }
    .day-editor-row button { flex: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen pb-16">

  <!-- 頂部深藍導航欄 -->
  <nav class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-black text-base shadow">
          <i class="fa-solid fa-receipt"></i>
        </div>
        <div>
          <h1 class="text-sm font-black tracking-wide leading-none">個人記帳系統</h1>
          <p class="text-[10px] text-slate-400 mt-1">專業視覺升級版 · bills 雲端直連</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-amber-400 transition border border-slate-700 text-xs" title="切換主題">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>

        <div id="authSection">
          <button id="btnLogin" onclick="loginWithGoogle()" class="bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs shadow flex items-center gap-1.5">
            <i class="fa-brands fa-google text-red-500"></i>
            <span>Google 登入</span>
          </button>

          <div id="userProfile" class="hidden flex items-center space-x-2">
            <img id="userAvatar" class="w-7 h-7 rounded-full border border-indigo-400" src="" alt="Avatar" />
            <button onclick="logout()" class="text-[11px] bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-2 py-1 rounded transition border border-slate-700">
              登出
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 未登入畫面提示 -->
  <div id="loginPrompt" class="max-w-sm mx-auto mt-12 p-6 text-center bg-white dark:bg-slate-900 rounded-2xl shadow border border-slate-200 dark:border-slate-800">
    <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-base font-bold mb-1">請先登入 Google 帳號</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">登入後將連接既有的 bills 帳單資料庫與所有歷史紀錄。</p>
    <button onclick="loginWithGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs shadow transition flex items-center justify-center gap-2">
      <i class="fa-brands fa-google"></i>
      <span>使用 Google 快速登入</span>
    </button>
  </div>

  <!-- 主操作介面 -->
  <main id="appContent" class="hidden max-w-2xl mx-auto px-3.5 mt-4 space-y-4">

    <!-- 1. 新增帳目卡片（單筆模式，預設顯示） -->
    <div id="singleModeForm" class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-3">
      <h3 class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5 border-b border-slate-100 dark:border-slate-800 pb-2">
        <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 快速新增帳目
      </h3>

      <form id="recordForm" onsubmit="handleCreateRecord(event)" class="space-y-2.5 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="typeBtnExpense" onclick="setRecordType('expense')" class="py-2 rounded-xl font-bold border-2 border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-arrow-trend-down"></i> 支出 (-)
          </button>
          <button type="button" id="typeBtnIncome" onclick="setRecordType('income')" class="py-2 rounded-xl font-bold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-arrow-trend-up"></i> 收入 (+)
          </button>
        </div>
        <input type="hidden" id="recType" value="expense" />

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">分類項目</label>
            <select id="recCategory" class="w-full border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 font-bold bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none"></select>
          </div>
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">金額 (HKD)</label>
            <div class="relative">
              <span class="absolute left-2.5 top-2 font-bold text-slate-400">HK$</span>
              <input type="number" step="0.01" id="recAmount" required placeholder="0.00" class="w-full border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-2 py-2 text-sm font-black bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">交易日期</label>
          <input type="date" id="recDate" required class="w-full border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="font-bold text-slate-600 dark:text-slate-300">備註說明</label>
            <button type="button" onclick="startVoiceInput()" class="text-[11px] text-indigo-600 dark:text-indigo-400 font-bold flex items-center gap-1">
              <i class="fa-solid fa-microphone"></i> 語音輸入
            </button>
          </div>
          <input type="text" id="recNote" placeholder="例如：加德士入油、茶餐廳午餐..." class="w-full border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-2.5 rounded-xl shadow transition flex items-center justify-center gap-1.5 text-sm mt-1">
          <i class="fa-solid fa-plus"></i> 儲存新記錄
        </button>
      </form>
    </div>

    <!-- ★ 新增：模式切換及進階輸入區 ★ -->
    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-3">
      <div class="flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2">
        <span class="text-xs font-bold text-slate-600 dark:text-slate-300">輸入模式：</span>
        <button onclick="switchMode('single')" id="modeSingleBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow">單筆</button>
        <button onclick="switchMode('calendar')" id="modeCalBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200">月曆</button>
        <button onclick="switchMode('matrix')" id="modeMatrixBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200">矩陣</button>
      </div>

      <!-- 月曆模式容器 -->
      <div id="calendarContainer" class="hidden space-y-2">
        <div class="flex justify-between items-center">
          <button onclick="shiftCalMonth(-1)" class="px-2 py-1 text-xs bg-slate-100 dark:bg-slate-800 rounded">◀</button>
          <span id="calMonthLabel" class="text-sm font-bold"></span>
          <button onclick="shiftCalMonth(1)" class="px-2 py-1 text-xs bg-slate-100 dark:bg-slate-800 rounded">▶</button>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
        <div class="text-[10px] text-slate-400 mt-1">💡 點擊日期可輸入當日多項收入</div>
      </div>

      <!-- 矩陣模式容器 -->
      <div id="matrixContainer" class="hidden overflow-x-auto">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold">分類 × 日期 輸入矩陣</span>
          <button onclick="submitMatrix()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded-lg text-xs">提交矩陣數據</button>
        </div>
        <div id="matrixTableWrap" class="overflow-auto max-h-72"></div>
      </div>
    </div>

    <!-- 2. 月份篩選與匯出按鈕 -->
    <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-500" id="monthDisplay">🔎 檢視範圍：全年全部記錄</span>
        <div class="flex items-center gap-1.5">
          <button onclick="exportCSV('utf8')" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 font-bold px-2 py-1 rounded-lg text-xs border border-slate-300 dark:border-slate-700 transition">
            <i class="fa-solid fa-file-csv text-blue-500"></i> UTF-8
          </button>
          <button onclick="exportCSV('big5')" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-2 py-1 rounded-lg text-xs shadow transition">
            <i class="fa-solid fa-file-excel"></i> Big5(Excel)
          </button>
          <button onclick="exportProfessionalExcel()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow transition">
            <i class="fa-regular fa-file-excel"></i> 專業Excel
          </button>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="shiftMonth(-1)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs hover:bg-slate-200">◀ 上月</button>
        <select id="filterSel" onchange="onFilterChange()" class="flex-1 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-bold bg-slate-50 dark:bg-slate-800 dark:text-white outline-none">
          <option value="">📋 顯示全年全部記錄</option>
        </select>
        <button onclick="shiftMonth(1)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs hover:bg-slate-200">下月 ▶</button>
      </div>
    </div>

    <!-- 3. 收支統計雙圖表 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
      <div class="bg-emerald-50/70 dark:bg-emerald-950/30 p-4 rounded-2xl border border-emerald-200 dark:border-emerald-900/50 space-y-2.5">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-emerald-800 dark:text-emerald-400 flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-down-left"></i> 收入統計
          </h3>
          <span class="text-base font-black text-emerald-600 dark:text-emerald-400" id="incomeTotalEl">$0.00</span>
        </div>
        <div class="h-36 relative flex items-center justify-center">
          <canvas id="incomeChartCanvas"></canvas>
        </div>
        <div id="incomeCatList" class="space-y-1 max-h-28 overflow-y-auto pr-1 text-[11px] divide-y divide-emerald-200/50 dark:divide-emerald-900/30"></div>
      </div>

      <div class="bg-rose-50/70 dark:bg-rose-950/30 p-4 rounded-2xl border border-rose-200 dark:border-rose-900/50 space-y-2.5">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-rose-800 dark:text-rose-400 flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-up-right"></i> 支出統計
          </h3>
          <span class="text-base font-black text-rose-600 dark:text-rose-400" id="expenseTotalEl">$0.00</span>
        </div>
        <div class="h-36 relative flex items-center justify-center">
          <canvas id="expenseChartCanvas"></canvas>
        </div>
        <div id="expenseCatList" class="space-y-1 max-h-28 overflow-y-auto pr-1 text-[11px] divide-y divide-rose-200/50 dark:divide-rose-900/30"></div>
      </div>
    </div>

    <!-- 4. 整體結算小卡 -->
    <div class="bg-blue-50/70 dark:bg-blue-950/30 p-3.5 rounded-2xl border border-blue-200 dark:border-blue-900/50 flex justify-between items-center text-xs">
      <div>
        <div class="text-[10px] text-blue-700 dark:text-blue-400 font-bold uppercase">淨結餘 (收入 - 支出)</div>
        <div class="text-lg font-black mt-0.5" id="netBalanceEl">$0.00</div>
      </div>
      <div class="text-right">
        <div class="text-[10px] text-slate-500 font-bold">平均每日開支 (選定月)</div>
        <div class="text-sm font-black text-slate-700 dark:text-slate-300 mt-0.5" id="avgDailyEl">$0.00</div>
      </div>
    </div>

    <!-- 5. 記錄列表 -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div class="p-3 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
        <h3 class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
          <i class="fa-solid fa-list-ul text-indigo-600"></i> 記錄明細（新 → 舊）
        </h3>
        <span class="text-[10px] font-bold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded-full" id="recordCount">共 0 筆</span>
      </div>
      <div class="divide-y divide-slate-100 dark:divide-slate-800" id="recordListEl"></div>
    </div>
  </main>

  <!-- 編輯彈窗 -->
  <div id="editModalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 border border-slate-200 dark:border-slate-800">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
          <i class="fa-solid fa-pen text-indigo-600"></i> 編輯帳目記錄
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="editRecordKey" />

      <div class="space-y-2 text-xs">
        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">類型</label>
          <select id="editTypeSel" onchange="rebuildCategorySelect(document.getElementById('editCatSel'), this.value)" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-800 dark:text-white outline-none">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">分類</label>
            <select id="editCatSel" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-800 dark:text-white outline-none"></select>
          </div>
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">金額 (HKD)</label>
            <input id="editMoney" type="number" step="0.01" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1.5 font-bold bg-white dark:bg-slate-800 dark:text-white outline-none" />
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">日期</label>
          <input id="editDate" type="date" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-800 dark:text-white outline-none" />
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-300 mb-1">備註</label>
          <input id="editRemark" type="text" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-800 dark:text-white outline-none" />
        </div>
      </div>

      <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center">
        <button onclick="handleDeleteRecord()" class="px-3 py-1.5 text-xs font-bold bg-rose-600 text-white rounded-lg hover:bg-rose-700">刪除記錄</button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs text-slate-500">取消</button>
          <button onclick="handleSaveEdit()" class="px-3 py-1.5 text-xs font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存修改</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ★ 新增：日期編輯彈窗（用於月曆點擊） ★ -->
  <div id="dayEditorOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 border border-slate-200 dark:border-slate-800">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white" id="dayEditorTitle">📅 編輯日期</h3>
        <button onclick="closeDayEditor()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="dayEditorBody" class="space-y-2 max-h-64 overflow-y-auto"></div>
      <button onclick="addDayEditorRow()" class="text-xs text-indigo-600 font-bold"><i class="fa-solid fa-plus"></i> 新增一行</button>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
        <button onclick="closeDayEditor()" class="px-3 py-1.5 text-xs text-slate-500">取消</button>
        <button onclick="submitDayRecords()" class="px-3 py-1.5 text-xs font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存當日收入</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 主題 =====
    function initTheme() {
      const isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      applyTheme(isDark);

    function applyFilterAndRender() {
      const list = getFilteredRecords();
      const incomeList = list.filter(x => x.type === "income");
      const expenseList = list.filter(x => x.type === "expense");

      let totalIncome = 0;
      const incomeCatSum = {};
      INCOME_CATS.forEach(c => incomeCatSum[c] = 0);
      incomeList.forEach(r => {
        totalIncome += r.money;
        incomeCatSum[r.category] = (incomeCatSum[r.category] || 0) + r.money;
      });

      let totalExpense = 0;
      const expenseCatSum = {};
      EXPENSE_CATS.forEach(c => expenseCatSum[c] = 0);
      expenseList.forEach(r => {
        totalExpense += r.money;
        expenseCatSum[r.category] = (expenseCatSum[r.category] || 0) + r.money;
      });

      const net = totalIncome - totalExpense;
      let avgDaily = 0;
      if (filterValue !== "") {
        const [y, m] = filterValue.split("-");
        const days = new Date(Number(y), Number(m), 0).getDate();
        avgDaily = days > 0 ? totalExpense / days : 0;
      }

      document.getElementById("incomeTotalEl").textContent = `$${totalIncome.toFixed(2)}`;
      document.getElementById("expenseTotalEl").textContent = `$${totalExpense.toFixed(2)}`;
      
      const netEl = document.getElementById("netBalanceEl");

    function renderDoughnutChart(type, dataMap) {
      const isInc = (type === 'income');
      const canvas = document.getElementById(isInc ? "incomeChartCanvas" : "expenseChartCanvas");
      const ctx = canvas.getContext("2d");
      const labels = Object.keys(dataMap).filter(k => dataMap[k] > 0);
      const data = labels.map(k => dataMap[k]);

      if (isInc && incomeChart) { incomeChart.destroy(); incomeChart = null; }
      if (!isInc && expenseChart) { expenseChart.destroy(); expenseChart = null; }
      if (data.length === 0) return;

      const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e', '#64748b'],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });

      if (isInc) incomeChart = chart; else expenseChart = chart;
    }

    function exportCSV(encoding) {

      const lines = ["日期,類型,分類,金額,備註"];
      list.forEach(r => {
        const t = r.type === "income" ? "收入" : "支出";
        const cat = `"${(r.category || "").replace(/"/g, '""')}"`;
        const rem = `"${(r.remark || "").replace(/"/g, '""')}"`;
        lines.push(`${r.day},${t},${cat},${Number(r.money).toFixed(2)},${rem}`);
      });
      let csv = lines.join("\n");
      if (encoding === "utf8") csv = "\ufeff" + csv;
      const blob = new Blob([csv], { type: "text/csv;charset=" + (encoding === "utf8" ? "utf-8" : "gbk") });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `帳單_${encoding}_${filterValue || '全年'}.csv`;

    function initCalendar() {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
    }

    function switchMode(mode) {
      currentMode = mode;
      ['single', 'calendar', 'matrix'].forEach(m => {
        const btn = document.getElementById(m === 'single' ? 'modeSingleBtn' : (m === 'calendar' ? 'modeCalBtn' : 'modeMatrixBtn'));
        if (m === mode) {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200';
        }
      });
      document.getElementById('calendarContainer').classList.toggle('hidden', mode !== 'calendar');
      document.getElementById('matrixContainer').classList.toggle('hidden', mode !== 'matrix');
      // 控制單筆表單
      const singleForm = document.getElementById('singleModeForm');
      if (singleForm) {
        singleForm.style.display = (mode === 'single') ? '' : 'none';
      }
      if (mode === 'calendar') {
        if (!calYear) initCalendar();
        renderCalendar(calYear, calMonth);
      } else if (mode === 'matrix') {
        if (!calYear) initCalendar();
        renderMatrix(calYear, calMonth);
      }
    }

    function shiftCalMonth(delta) {
      const d = new Date(calYear, calMonth + delta, 1);
      calYear = d.getFullYear();
      calMonth = d.getMonth();
      renderCalendar(calYear, calMonth);
    }

    function renderCalendar(year, month) {
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('calMonthLabel');
      label.textContent = `${year}年${month+1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const today = new Date().toISOString().slice(0,10);

      const monthRecords = allRecords.filter(r => {
        if (r.type !== 'income') return false;
        const d = r.day;
        return d && d.startsWith(`${year}-${String(month+1).padStart(2,'0')}`);
      });

      const dayTotal = {};
      monthRecords.forEach(r => {
        const key = r.day;
        dayTotal[key] = (dayTotal[key] || 0) + r.money;
      });

      let html = '';
      const weekDays = ['日','一','二','三','四','五','六'];
      weekDays.forEach(d => html += `<div class="text-[10px] font-bold text-slate-400 py-1">${d}</div>`);

      for (let i=0; i<firstDay; i++) html += `<div></div>`;

      for (let d=1; d<=daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const total = dayTotal[dateStr] || 0;
        const has = total > 0;
        const isToday = dateStr === today;
        let cls = 'cal-day';
        if (has) cls += ' has-record';
        if (isToday) cls += ' ring-2 ring-indigo-500';
        const amountText = has ? `$${total.toFixed(0)}` : '';
        html += `<div class="${cls}" onclick="openDayEditor('${dateStr}')">
          <span class="day-label">${d}</span>
          <span class="day-total">${amountText}</span>
        </div>`;
      }

      grid.innerHTML = html;
    }

    function openDayEditor(dateStr) {
      editingDate = dateStr;
      document.getElementById('dayEditorTitle').textContent = `📅 編輯 ${dateStr} 收入`;
      const body = document.getElementById('dayEditorBody');
      body.innerHTML = '';

      const existing = allRecords.filter(r => r.day === dateStr && r.type === 'income');
      if (existing.length === 0) {
        addDayEditorRow();
      } else {
        existing.forEach(r => {
          addDayEditorRow(r.category, r.money);
        });
      }

      document.getElementById('dayEditorOverlay').classList.remove('hidden');
    }

    function closeDayEditor() {
      document.getElementById('dayEditorOverlay').classList.add('hidden');
    }

    function addDayEditorRow(cat = '', amount = '') {
      const body = document.getElementById('dayEditorBody');
      const rowDiv = document.createElement('div');
      rowDiv.className = 'day-editor-row';
      const select = document.createElement('select');
      select.className = 'border rounded px-1 py-0.5 text-xs bg-white dark:bg-slate-800 dark:border-slate-700';
      INCOME_CATS.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        if (c === cat) opt.selected = true;
        select.appendChild(opt);
      });
      const input = document.createElement('input');
      input.type = 'number';
      input.step = '0.01';
      input.placeholder = '金額';
      input.value = amount;
      input.className = 'border rounded px-1 py-0.5 text-xs bg-white dark:bg-slate-800 dark:border-slate-700 text-right';
      const delBtn = document.createElement('button');
      delBtn.innerHTML = '<i class="fa-solid fa-trash-can text-rose-500"></i>';
      delBtn.className = 'text-xs';
      delBtn.onclick = function() {
        if (body.children.length > 1) body.removeChild(rowDiv);
      };
      rowDiv.appendChild(select);
      rowDiv.appendChild(input);
      rowDiv.appendChild(delBtn);
      body.appendChild(rowDiv);
    }

    function getDayEditorData() {
      const rows = document.querySelectorAll('.day-editor-row');
      const data = [];
      rows.forEach(row => {
        const sel = row.querySelector('select');
        const inp = row.querySelector('input[type="number"]');
        const val = parseFloat(inp.value);
        if (!isNaN(val) && val > 0) {
          data.push({ category: sel.value, money: val });
        }
      });
      return data;
    }

    function submitDayRecords() {
      if (!currentUser) return alert('請先登入');
      const data = getDayEditorData();
      if (data.length === 0) return alert('請至少輸入一筆有效金額');

      const date = editingDate;
      const toRemove = allRecords.filter(r => r.day === date && r.type === 'income');
      const updates = {};
      toRemove.forEach(r => {
        updates[`bills/${currentUser.uid}/${r.key}`] = null;
      });

      data.forEach(item => {
        const newKey = db.ref(`bills/${currentUser.uid}`).push().key;
        updates[`bills/${currentUser.uid}/${newKey}`] = {
          type: 'income',
          category: item.category,
          money: item.money,
          day: date,
          remark: '',
          timestamp: Date.now()
        };
      });

      db.ref().update(updates, (err) => {
        if (err) alert('提交失敗: ' + err.message);
        else {
          closeDayEditor();
          if (currentMode === 'calendar') renderCalendar(calYear, calMonth);
          else if (currentMode === 'matrix') renderMatrix(calYear, calMonth);
        }
      });
    }

    function renderMatrix(year, month) {
      const wrap = document.getElementById('matrixTableWrap');
      const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
      const daysInMonth = new Date(year, month+1, 0).getDate();

      const monthRecords = allRecords.filter(r => r.type === 'income' && r.day && r.day.startsWith(monthStr));
      const cats = INCOME_CATS;
      const data = {};
      cats.forEach(c => { data[c] = {}; });
      monthRecords.forEach(r => {
        const d = parseInt(r.day.split('-')[2], 10);
        if (data[r.category]) {
          data[r.category][d] = (data[r.category][d] || 0) + r.money;
        }
      });

      let html = `<table class="min-w-full text-xs border-collapse">
        <thead><tr><th class="border p-1 bg-slate-100 dark:bg-slate-800">分類</th>`;
      for (let d=1; d<=daysInMonth; d++) {
        html += `<th class="border p-1 bg-slate-100 dark:bg-slate-800">${d}</th>`;
      }
      html += `</tr></thead><tbody>`;

      cats.forEach(cat => {
        html += `<tr><td class="border p-1 font-bold">${cat}</td>`;
        for (let d=1; d<=daysInMonth; d++) {
          const val = data[cat]?.[d] || '';
          const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          html += `<td class="border p-0 matrix-cell">
            <input type="number" step="0.01" data-cat="${cat}" data-date="${dateStr}" value="${val}" class="w-full" />
          </td>`;
        }
        html += `</tr>`;
      });
      html += `</tbody></table>`;
      wrap.innerHTML = html;
    }

    function submitMatrix() {
      if (!currentUser) return alert('請先登入');
      const inputs = document.querySelectorAll('#matrixTableWrap input[type="number"]');
      const toSubmit = [];
      inputs.forEach(inp => {
        const val = parseFloat(inp.value);
        if (!isNaN(val) && val > 0) {
          const cat = inp.dataset.cat;
          const date = inp.dataset.date;
          toSubmit.push({ category: cat, money: val, day: date });
        }
      });
      if (toSubmit.length === 0) return alert('沒有有效數據可提交');

      const month = toSubmit[0].day.substring(0,7);
      const toRemove = allRecords.filter(r => r.type === 'income' && r.day && r.day.startsWith(month));
      const updates = {};
      toRemove.forEach(r => {
        updates[`bills/${currentUser.uid}/${r.key}`] = null;
      });

      toSubmit.forEach(item => {
        const newKey = db.ref(`bills/${currentUser.uid}`).push().key;
        updates[`bills/${currentUser.uid}/${newKey}`] = {
          type: 'income',
          category: item.category,
          money: item.money,
          day: item.day,
          remark: '',
          timestamp: Date.now()
        };
      });

      db.ref().update(updates, (err) => {
        if (err) alert('提交失敗: ' + err.message);
        else {
          alert('矩陣數據已更新！');
          renderMatrix(calYear, calMonth);
        }
      });
    }

    // 快捷功能：複製昨日收入
    function copyYesterdayIncome() {
      if (!editingDate) return;
      const d = new Date(editingDate);
      d.setDate(d.getDate() - 1);
      const yest = d.toISOString().slice(0,10);
      const yestRecords = allRecords.filter(r => r.day === yest && r.type === 'income');
      if (yestRecords.length === 0) return alert('昨日無收入記錄');

      const body = document.getElementById('dayEditorBody');
      body.innerHTML = '';
      yestRecords.forEach(r => {
        addDayEditorRow(r.category, r.money);
      });
    }

    // 快捷功能：填充本月某分類固定金額
    function fillCategoryFixedAmount() {
      const cat = prompt('請輸入收入分類名稱（必須在收入分類列表中）');
      if (!cat || !INCOME_CATS.includes(cat)) return alert('無效分類');
      const amount = parseFloat(prompt('請輸入每日固定金額 (HKD)'));
      if (isNaN(amount) || amount <= 0) return alert('請輸入有效金額');

      const inputs = document.querySelectorAll(`#matrixTableWrap input[data-cat="${cat}"]`);
      if (inputs.length === 0) return alert('矩陣中無此分類');
      inputs.forEach(inp => inp.value = amount);
    }

    function addShortcutButtons() {
      const titleDiv = document.querySelector('#dayEditorOverlay .flex.justify-between');
      if (titleDiv && !titleDiv.querySelector('.copy-yesterday-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-yesterday-btn text-xs text-indigo-600 font-bold';
        btn.innerHTML = '<i class="fa-regular fa-copy"></i> 複製昨日';
        btn.onclick = copyYesterdayIncome;
        titleDiv.appendChild(btn);
      }

      const matrixContainer = document.getElementById('matrixContainer');
      const topDiv = matrixContainer.querySelector('.flex.justify-between');
      if (topDiv && !topDiv.querySelector('.fill-category-btn')) {
        const btn = document.createElement('button');
        btn.className = 'fill-category-btn bg-amber-500 hover:bg-amber-600 text-white font-bold px-2 py-1 rounded-lg text-xs';
        btn.innerHTML = '<i class="fa-solid fa-fill-drip"></i> 填充分類';
        btn.onclick = fillCategoryFixedAmount;
        topDiv.appendChild(btn);
      }
    }

    function initAdvancedFeatures() {
      initCalendar();
      addShortcutButtons();
      // 預設單筆模式，但若用戶之前已登入，則 switchMode 會觸發渲染
      if (document.getElementById('appContent').classList.contains('hidden') === false) {
        switchMode('single');
      }
    }

    // 初始化完畢
    console.log('✅ 個人記帳系統已升級，支援單筆、月曆、矩陣三種輸入模式！');
  </script>
</body>
</html>
