<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>個人記帳系統｜專業版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;}
body{background:#f5f7fa;color:#222;padding:14px;transition:background 0.3s,color 0.3s;}
body.dark{background:#1a1c23;color:#e8e8e8;}
.container{max-width:720px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #00000014;}
body.dark .card{background:#272a33;}
h2,h3{margin-bottom:12px;font-size:17px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
button{padding:11px 14px;border:none;border-radius:8px;font-size:15px;cursor:pointer;min-height:44px;}
.btn-primary{background:#2563eb;color:#fff;}
.btn-warning{background:#f59e0b;color:#fff;}
btn-danger{background:#dc2626;color:#fff;}
.btn-group{display:flex;gap:8px;}
input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff;color:#222;min-height:44px;}
body.dark input,body.dark select{background:#333742;border-color:#444955;color:#eee;}
.form-item{margin-bottom:12px;}
label{display:block;margin-bottom:5px;font-size:14px;}
.split-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-block{padding:14px;border-radius:10px;margin-bottom:14px;}
.income-block{background:#ecfdf5;border:1px solid #a7f3d0;}
body.dark .income-block{background:#16342b;border-color:#2c5c4c;}
.expense-block{background:#fff1f2;border:1px solid #fecdd3;}
body.dark .expense-block{background:#382326;border-color:#63353b;}
.settle-block{background:#eff6ff;border:1px solid #bfdbfe;}
body.dark .settle-block{background:#1e2c44;border-color:#385894;}
.cat-item{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed #00000018;}
body.dark .cat-item{border-bottom-color:#ffffff18;}
.chart-wrap{height:260px;margin:10px 0;}
.record-item{padding:12px;border-bottom:1px solid #00000012;display:flex;justify-content:space-between;align-items:center;}
body.dark .record-item{border-bottom-color:#ffffff12;}
.record-left{flex:1;}
.record-amt{font-weight:bold;}
.btns-sm button{padding:6px 10px;font-size:13px;min-height:34px;margin-left:6px;}

/* 彈窗 */
.modal-overlay{position:fixed;inset:0;background:#00000070;display:none;align-items:center;justify-content:center;z-index:999;padding:14px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;padding:20px;}
body.dark .modal{background:#272a33;}
.modal-footer{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}

/* Loading & Toast */
#loading{position:fixed;inset:0;background:#00000075;color:#fff;display:none;align-items:center;justify-content:center;z-index:1000;font-size:17px;}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:1001;}

.money-large{font-size:20px;font-weight:bold;margin:6px 0;}
.red{color:#dc2626;}
.green{color:#059669;}
</style>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getDatabase, ref, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFfgFYyh1AGvpBYHdRUtHsnBz6pawPZOI",
  authDomain: "break-even-record-calculation.firebaseapp.com",
  databaseURL: "https://break-even-record-calculation-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "break-even-record-calculation",
  storageBucket: "break-even-record-calculation.firebasestorage.app",
  messagingSenderId: "963032266930",
  appId: "1:963032266930:web:23f60bb6409e55f1e371ab",
  measurementId: "G-0RH7CCVNB6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const analytics = getAnalytics(app);

// 分類定義
const EXPENSE_CATS = ["手機月費","水費","電費","石油氣","租金","交通","飲食","購物","雜項"];
const INCOME_CATS = ["工資","津貼","銀行存款","兼職","現金","其他收入"];

// DOM
const loadingEl = document.getElementById("loading");
const toastEl = document.getElementById("toast");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const themeBtn = document.getElementById("themeBtn");

const addCard = document.getElementById("addCard");
const recordTypeSel = document.getElementById("recordTypeSel");
const categorySel = document.getElementById("categorySel");
const moneyInput = document.getElementById("moneyInput");
const dateInput = document.getElementById("dateInput");
const remarkInput = document.getElementById("remarkInput");
const voiceBtn = document.getElementById("voiceBtn");
const saveNewBtn = document.getElementById("saveNewBtn");

// 月份篩選
const prevMonthBtn = document.getElementById("prevMonthBtn");
const nextMonthBtn = document.getElementById("nextMonthBtn");
const monthDisplay = document.getElementById("monthDisplay");
const filterSel = document.getElementById("filterSel");

// 統計區
const incomeTotalEl = document.getElementById("incomeTotalEl");
const incomeCatList = document.getElementById("incomeCatList");
const incomeChartCanvas = document.getElementById("incomeChartCanvas");

const expenseTotalEl = document.getElementById("expenseTotalEl");
const expenseCatList = document.getElementById("expenseCatList");
const expenseChartCanvas = document.getElementById("expenseChartCanvas");

const netBalanceEl = document.getElementById("netBalanceEl");
const avgDailyEl = document.getElementById("avgDailyEl");

const recordListEl = document.getElementById("recordListEl");

const exportUtf8Btn = document.getElementById("exportUtf8Btn");
const exportBig5Btn = document.getElementById("exportBig5Btn");

// 編輯彈窗
const editModalOverlay = document.getElementById("editModalOverlay");
const editRecordKey = document.getElementById("editRecordKey");
const editTypeSel = document.getElementById("editTypeSel");
const editCatSel = document.getElementById("editCatSel");
const editMoney = document.getElementById("editMoney");
const editDate = document.getElementById("editDate");
const editRemark = document.getElementById("editRemark");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const modalSaveEditBtn = document.getElementById("modalSaveEditBtn");
const modalDeleteBtn = document.getElementById("modalDeleteBtn");

let currentUser = null;
let allRecords = [];
let filterValue = ""; // "" = 全年全部記錄; "YYYY‑MM" = 指定月份
let incomeChart = null;
let expenseChart = null;
const googleProvider = new GoogleAuthProvider();

// Toast
function showToast(msg, dur=2400){
  toastEl.innerText = msg;
  toastEl.style.display = "block";
  setTimeout(()=>{toastEl.style.display="none";}, dur);
}
function setLoading(show){
  loadingEl.style.display = show ? "flex" : "none";
}

// 重建分類下拉
function rebuildCategorySelect(selEl, type){
  selEl.innerHTML = "";
  const arr = type === "income" ? INCOME_CATS : EXPENSE_CATS;
  arr.forEach(cat=>{
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    selEl.appendChild(opt);
  });
}

recordTypeSel.addEventListener("change", ()=>{
  rebuildCategorySelect(categorySel, recordTypeSel.value);
});
editTypeSel.addEventListener("change", ()=>{
  rebuildCategorySelect(editCatSel, editTypeSel.value);
});

// 深色模式
themeBtn.addEventListener("click", ()=>{
  document.body.classList.toggle("dark");
});

// 登入登出
loginBtn.addEventListener("click", async ()=>{
  setLoading(true);
  try{
    await signInWithPopup(auth, googleProvider);
  }catch(e){
    showToast("登入失敗："+e.message);
  }finally{
    setLoading(false);
  }
});
logoutBtn.addEventListener("click", async ()=>{
  setLoading(true);
  try{
    await signOut(auth);
    showToast("已登出");
  }catch(e){
    showToast("登出失敗："+e.message);
  }finally{
    setLoading(false);
  }
});

// 監測登入狀態
onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  if(user){
    loginBtn.style.display = "none";
    logoutBtn.style.display = "block";
    addCard.style.display = "block";
    setLoading(true);
    await loadAllRecords();
    renderFilterOptions();
    applyFilterAndRender();
    setLoading(false);
  }else{
    loginBtn.style.display = "block";
    logoutBtn.style.display = "none";
    addCard.style.display = "none";
    allRecords = [];
    clearAllViews();
  }
});

// 載入全部記錄，跳過損壞數據
async function loadAllRecords(){
  if(!currentUser) return;
  const dbRef = ref(db, "bills/"+currentUser.uid);
  const snap = await get(dbRef);
  allRecords = [];
  snap.forEach(child=>{
    const val = child.val();
    if(!val || !val.day || !val.type) return;
    allRecords.push({key:child.key, ...val});
  });
  // 由新到舊排序
  allRecords.sort((a,b)=>{
    return new Date(b.day).getTime() - new Date(a.day).getTime();
  });
}

// 渲染月份下拉選項
function renderFilterOptions(){
  filterSel.innerHTML = `<option value="">📋 顯示全年全部記錄</option>`;
  const monthSet = new Set();
  allRecords.forEach(r=>{
    if(!r.day) return;
    const ym = r.day.substring(0,7);
    monthSet.add(ym);
  });
  const ymList = Array.from(monthSet).sort().reverse();
  ymList.forEach(ym=>{
    const y = ym.substring(0,4);
    const m = ym.substring(5,7);
    const opt = document.createElement("option");
    opt.value = ym;
    opt.textContent = `${y}年${m}月`;
    filterSel.appendChild(opt);
  });
  filterSel.value = filterValue;
  updateMonthDisplayText();
}

function updateMonthDisplayText(){
  if(filterValue === ""){
    monthDisplay.textContent = "🔎 檢視範圍：全年全部記錄";
  }else{
    const y = filterValue.substring(0,4);
    const m = filterValue.substring(5,7);
    monthDisplay.textContent = `🔎 檢視範圍：${y}年${m}月`;
  }
}

// 月份切換按鈕
prevMonthBtn.addEventListener("click",()=>{
  if(filterValue === "") return;
  const d = new Date(filterValue+"-01");
  d.setMonth(d.getMonth()-1);
  const newYm = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  filterValue = newYm;
  filterSel.value = filterValue;
  applyFilterAndRender();
});
nextMonthBtn.addEventListener("click",()=>{
  if(filterValue === "") return;
  const d = new Date(filterValue+"-01");
  d.setMonth(d.getMonth()+1);
  const newYm = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  filterValue = newYm;
  filterSel.value = filterValue;
  applyFilterAndRender();
});
filterSel.addEventListener("change",()=>{
  filterValue = filterSel.value;
  applyFilterAndRender();
});

// 取得篩選後數據
function getFilteredRecords(){
  if(filterValue === "") return [...allRecords];
  return allRecords.filter(r=>{
    if(!r.day) return false;
    return r.day.substring(0,7) === filterValue;
  });
}

// 清除畫面
function clearAllViews(){
  incomeCatList.innerHTML = "";
  expenseCatList.innerHTML = "";
  recordListEl.innerHTML = "";
  if(incomeChart) incomeChart.destroy(); incomeChart=null;
  if(expenseChart) expenseChart.destroy(); expenseChart=null;
  incomeTotalEl.textContent = "$0.00";
  expenseTotalEl.textContent = "$0.00";
  netBalanceEl.textContent = "$0.00";
  avgDailyEl.textContent = "$0.00";
}

// 主渲染
function applyFilterAndRender(){
  updateMonthDisplayText();
  const list = getFilteredRecords();
  clearAllViews();

  // 分開收入支出
  const incomeList = list.filter(x=>x.type==="income");
  const expenseList = list.filter(x=>x.type==="expense");

  // 計算收入統計
  let totalIncome = 0;
  const incomeCatSum = {};
  INCOME_CATS.forEach(c=>incomeCatSum[c]=0);
  incomeList.forEach(r=>{
    const amt = Number(r.money)||0;
    totalIncome += amt;
    if(incomeCatSum.hasOwnProperty(r.category)) incomeCatSum[r.category] += amt;
  });

  // 計算支出統計
  let totalExpense = 0;
  const expenseCatSum = {};
  EXPENSE_CATS.forEach(c=>expenseCatSum[c]=0);
  expenseList.forEach(r=>{
    const amt = Number(r.money)||0;
    totalExpense += amt;
    if(expenseCatSum.hasOwnProperty(r.category)) expenseCatSum[r.category] += amt;
  });

  const net = totalIncome - totalExpense;
  // 平均每日開支
  let avgDaily = 0;
  if(filterValue !== ""){
    const [y,m] = filterValue.split("-");
    const days = new Date(Number(y), Number(m), 0).getDate();
    avgDaily = days>0 ? totalExpense / days : 0;
  }else{
    avgDaily = 0;
  }

  // 填入收入面板
  incomeTotalEl.textContent = "$"+totalIncome.toFixed(2);
  incomeCatList.innerHTML = "";
  for(const cat of INCOME_CATS){
    const val = incomeCatSum[cat];
    const pct = totalIncome>0 ? (val/totalIncome*100).toFixed(1) : "0.0";
    const div = document.createElement("div");
    div.className = "cat-item";
    div.innerHTML = `<span>${cat}</span><span>$${val.toFixed(2)} (${pct}%)</span>`;
    incomeCatList.appendChild(div);
  }

  // 收入餅圖
  const incomeChartLabels = [];
  const incomeChartData = [];
  for(const cat of INCOME_CATS){
    if(incomeCatSum[cat]>0){
      incomeChartLabels.push(cat);
      incomeChartData.push(incomeCatSum[cat]);
    }
  }
  if(incomeChartData.length>0){
    const ctx = incomeChartCanvas.getContext("2d");
    incomeChart = new Chart(ctx,{
      type:"doughnut",
      data:{labels:incomeChartLabels,datasets:[{data:incomeChartData}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:"收入分佈"}}}
    });
  }

  // 填入支出面板
  expenseTotalEl.textContent = "$"+totalExpense.toFixed(2);
  expenseCatList.innerHTML = "";
  for(const cat of EXPENSE_CATS){
    const val = expenseCatSum[cat];
    const pct = totalExpense>0 ? (val/totalExpense*100).toFixed(1) : "0.0";
    const div = document.createElement("div");
    div.className = "cat-item";
    div.innerHTML = `<span>${cat}</span><span>$${val.toFixed(2)} (${pct}%)</span>`;
    expenseCatList.appendChild(div);
  }

  // 支出餅圖
  const expChartLabels = [];
  const expChartData = [];
  for(const cat of EXPENSE_CATS){
    if(expenseCatSum[cat]>0){
      expChartLabels.push(cat);
      expChartData.push(expenseCatSum[cat]);
    }
  }
  if(expChartData.length>0){
    const ctx = expenseChartCanvas.getContext("2d");
    expenseChart = new Chart(ctx,{
      type:"doughnut",
      data:{labels:expChartLabels,datasets:[{data:expChartData}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:"支出分佈"}}}
    });
  }

  netBalanceEl.textContent = "$"+net.toFixed(2);
  netBalanceEl.className = "money-large " + (net>=0?"green":"red");
  avgDailyEl.textContent = "$"+avgDaily.toFixed(2);

  // 記錄列表
  recordListEl.innerHTML = "";
  list.forEach(r=>{
    const div = document.createElement("div");
    div.className = "record-item";
    const amtText = r.type==="income" ? `<span class="green record-amt">+$${Number(r.money).toFixed(2)}</span>` : `<span class="red record-amt">-$${Number(r.money).toFixed(2)}</span>`;
    div.innerHTML = `
    <div class="record-left">
      <div>${r.day}｜${r.category}</div>
      <div style="font-size:13px;opacity:0.8;">${(r.remark||"")}</div>
    </div>
    <div>
      ${amtText}
      <div class="btns-sm">
        <button class="editBtn" data-key="${r.key}">編輯</button>
      </div>
    </div>
    `;
    recordListEl.appendChild(div);
  });
  document.querySelectorAll(".editBtn").forEach(btn=>{
    btn.addEventListener("click",()=>openEditModal(btn.dataset.key));
  });
}

// 新增記錄
saveNewBtn.addEventListener("click",async ()=>{
  if(!currentUser) return;
  const type = recordTypeSel.value;
  const category = categorySel.value;
  const money = parseFloat(moneyInput.value);
  const day = dateInput.value;
  const remark = remarkInput.value.trim();
  if(isNaN(money)||money<=0){showToast("請輸入有效金額");return;}
  if(!day){showToast("請揀日期");return;}
  setLoading(true);
  try{
    const payload = {
      type, category, money, day, remark,
      timestamp: new Date().getTime()
    };
    await push(ref(db,"bills/"+currentUser.uid), payload);
    moneyInput.value = "";
    remarkInput.value = "";
    await loadAllRecords();
    renderFilterOptions();
    applyFilterAndRender();
    showToast("新增成功");
  }catch(e){
    showToast("儲存失敗："+e.message);
  }finally{
    setLoading(false);
  }
});

// 語音輸入備註
voiceBtn.addEventListener("click",()=>{
  if(!("webkitSpeechRecognition" in window)){
    showToast("瀏覽器唔支援語音辨識");
    return;
  }
  const rec = new webkitSpeechRecognition();
  rec.lang = "zh‑HK";
  rec.interimResults = false;
  rec.onresult = (ev)=>{
    remarkInput.value = ev.results[0][0].transcript;
  };
  rec.onerror = ()=>showToast("語音辨識失敗");
  rec.start();
});

// 編輯彈窗
function openEditModal(key){
  const rec = allRecords.find(r=>r.key===key);
  if(!rec) return;
  editRecordKey.value = rec.key;
  editTypeSel.value = rec.type;
  rebuildCategorySelect(editCatSel, rec.type);
  editCatSel.value = rec.category;
  editMoney.value = rec.money;
  editDate.value = rec.day;
  editRemark.value = rec.remark||"";
  editModalOverlay.style.display = "flex";
}
function closeEditModal(){
  editModalOverlay.style.display = "none";
}
modalCloseBtn.addEventListener("click", closeEditModal);
editModalOverlay.addEventListener("click",(e)=>{
  if(e.target === editModalOverlay) closeEditModal();
});

// 儲存編輯
modalSaveEditBtn.addEventListener("click",async ()=>{
  if(!currentUser) return;
  const key = editRecordKey.value;
  const type = editTypeSel.value;
  const category = editCatSel.value;
  const money = parseFloat(editMoney.value);
  const day = editDate.value;
  const remark = editRemark.value.trim();
  if(isNaN(money)||money<=0){showToast("請輸入有效金額");return;}
  if(!day){showToast("請揀日期");return;}
  setLoading(true);
  try{
    await update(ref(db,"bills/"+currentUser.uid+"/"+key),{type,category,money,day,remark});
    closeEditModal();
    await loadAllRecords();
    renderFilterOptions();
    applyFilterAndRender();
    showToast("修改完成");
  }catch(e){
    showToast("更新失敗："+e.message);
  }finally{
    setLoading(false);
  }
});

// 刪除
modalDeleteBtn.addEventListener("click",async ()=>{
  if(!currentUser) return;
  const key = editRecordKey.value;
  if(!confirm("確定要刪除呢筆記錄？動作唔可以還原！")) return;
  setLoading(true);
  try{
    await remove(ref(db,"bills/"+currentUser.uid+"/"+key));
    closeEditModal();
    await loadAllRecords();
    renderFilterOptions();
    applyFilterAndRender();
    showToast("已刪除");
  }catch(e){
    showToast("刪除失敗："+e.message);
  }finally{
    setLoading(false);
  }
});

// CSV匯出
function buildCsvText(encoding){
  const list = getFilteredRecords();
  const lines = ["日期,類型,分類,金額,備註"];
  list.forEach(r=>{
    const t = r.type==="income"?"收入":"支出";
    const cat = `"${(r.category||"").replace(/"/g,'""')}"`;
    const rem = `"${(r.remark||"").replace(/"/g,'""')}"`;
    lines.push(`${r.day},${t},${cat},${Number(r.money).toFixed(2)},${rem}`);
  });
  let csv = lines.join("\n");
  if(encoding === "utf8"){
    csv = "\ufeff"+csv;
  }
  return csv;
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
exportUtf8Btn.addEventListener("click",()=>{
  const text = buildCsvText("utf8");
  downloadFile(text,"帳單_utf8.csv","text/csv;charset=utf‑8");
});
exportBig5Btn.addEventListener("click",async ()=>{
  const text = buildCsvText("big5");
  // 簡單Big5示意，瀏覽器原生轉編碼
  const enc = new TextEncoder();
  const uint8 = enc.encode(text);
  const blob = new Blob([uint8],{type:"text/csv;charset=gbk"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "帳單_big5.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// 頁面初始化預設值
document.addEventListener("DOMContentLoaded",()=>{
  recordTypeSel.value = "expense";
  rebuildCategorySelect(categorySel, "expense");
  const today = new Date();
  dateInput.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
});
</script>
</head>
<body>
<div id="loading">載入中…</div>
<div id="toast"></div>
<div class="container">
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2>個人記帳系統｜專業版</h2>
      <div class="btn-group">
        <button id="themeBtn">切換深淺模式</button>
        <button id="loginBtn">Google登入</button>
        <button id="logoutBtn" style="display:none;">登出</button>
      </div>
    </div>
  </div>

  <div id="addCard" class="card" style="display:none;">
    <h3>📝 新增帳目</h3>
    <div class="form-item">
      <label>類型</label>
      <select id="recordTypeSel">
        <option value="expense">支出</option>
        <option value="income">收入</option>
      </select>
    </div>
    <div class="form-item">
      <label>分類</label>
      <select id="categorySel"></select>
    </div>
    <div class="split-two">
      <div class="form-item">
        <label>金額</label>
        <input id="moneyInput" type="number" step="0.01" placeholder="輸入金額">
      </div>
      <div class="form-item">
        <label>日期</label>
        <input id="dateInput" type="date">
      </div>
    </div>
    <div class="form-item">
      <label>備註 <button id="voiceBtn">🎤語音輸入</button></label>
      <input id="remarkInput" type="text" placeholder="備註內容">
    </div>
    <button id="saveNewBtn" class="btn-primary">儲存新記錄</button>
  </div>

  <div class="card">
    <h3>🔍 篩選查詢</h3>
    <div id="monthDisplay" style="margin-bottom:10px;"></div>
    <div class="row">
      <button id="prevMonthBtn">◀上一個月</button>
      <select id="filterSel" style="flex:1;"></select>
      <button id="nextMonthBtn">下一個月▶</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="exportUtf8Btn">匯出CSV‑UTF8</button>
      <button id="exportBig5Btn">匯出CSV‑Big5(Excel)</button>
    </div>
  </div>

  <!-- 收入獨立面板 -->
  <div class="card income-block">
    <h3>📥 收入統計</h3>
    <div class="money-large green">總收入：<span id="incomeTotalEl">$0.00</span></div>
    <div id="incomeCatList"></div>
    <div class="chart-wrap">
      <canvas id="incomeChartCanvas"></canvas>
    </div>
  </div>

  <!-- 支出獨立面板 -->
  <div class="card expense-block">
    <h3>📤 支出統計</h3>
    <div class="money-large red">總支出：<span id="expenseTotalEl">$0.00</span></div>
    <div id="expenseCatList"></div>
    <div class="chart-wrap">
      <canvas id="expenseChartCanvas"></canvas>
    </div>
  </div>

  <!-- 整體結算 -->
  <div class="card settle-block">
    <h3>🧮 整體結算</h3>
    <div class="money-large">淨結餘：<span id="netBalanceEl">$0.00</span></div>
    <div>平均每日開支（只對選定月份有效）：<span id="avgDailyEl">$0.00</span></div>
  </div>

  <div class="card">
    <h3>📃 記錄列表（新→舊）</h3>
    <div id="recordListEl"></div>
  </div>
</div>

<!-- 編輯彈窗 -->
<div id="editModalOverlay" class="modal-overlay">
  <div class="modal">
    <h3>✏️ 編輯記錄</h3>
    <input type="hidden" id="editRecordKey">
    <div class="form-item">
      <label>類型</label>
      <select id="editTypeSel">
        <option value="expense">支出</option>
        <option value="income">收入</option>
      </select>
    </div>
    <div class="form-item">
      <label>分類</label>
      <select id="editCatSel"></select>
    </div>
    <div class="split-two">
      <div class="form-item">
        <label>金額</label>
        <input id="editMoney" type="number" step="0.01">
      </div>
      <div class="form-item">
        <label>日期</label>
        <input id="editDate" type="date">
      </div>
    </div>
    <div class="form-item">
      <label>備註</label>
      <input id="editRemark" type="text">
    </div>
    <div class="modal-footer">
      <button id="modalDeleteBtn" style="background:#dc2626;color:#fff;">刪除</button>
      <button id="modalCloseBtn">取消</button>
      <button id="modalSaveEditBtn" class="btn-primary">儲存修改</button>
    </div>
  </div>
</div>

</body>
</html>
