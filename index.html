<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>個人記帳系統</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getDatabase, ref, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFfgFYyh1AGvpBYHdRUtHsnBz6pawPZOI",
  authDomain: "break-even-record-calculation.firebaseapp.com",
  databaseURL: "https://break-even-record-calculation-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "break-even-record-calculation",
  storageBucket: "break-even-record-calculation.firebasestorage.app",
  messagingSenderId: "963032266930",
  appId: "1:963032266930:web:23f60bb6409e55f1e371ab",
  measurementId: "G-0RH7CCVNB6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const analytics = getAnalytics(app);

const loadingEl = document.getElementById("loading");
const tipBoxEl = document.getElementById("tipBox");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const themeBtn = document.getElementById("themeBtn");
const addBillBox = document.getElementById("addBillBox");
const chartBox = document.getElementById("chartBox");
const listBox = document.getElementById("listBox");
const voiceBtn = document.getElementById("voiceBtn");
const exportUtf8 = document.getElementById("exportUtf8");
const exportBig5 = document.getElementById("exportBig5");
const submitBtn = document.getElementById("submitBtn");
const billType = document.getElementById("billType");
const billMoney = document.getElementById("billMoney");
const billClass = document.getElementById("billClass");
const billRemark = document.getElementById("billRemark");
const billListEl = document.getElementById("billList");
const monthTotalText = document.getElementById("monthTotalText");
const myChartCanvas = document.getElementById("myChart");
const monthFilterSelect = document.getElementById("monthFilterSelect");
const editModal = document.getElementById("editModal");
const editKeyInput = document.getElementById("editKeyInput");
const editType = document.getElementById("editType");
const editMoney = document.getElementById("editMoney");
const editClass = document.getElementById("editClass");
const editRemark = document.getElementById("editRemark");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const modalSaveBtn = document.getElementById("modalSaveBtn");

let currentUser = null;
let chartInstance = null;
let allBillData = [];
let selectedFilterMonth = "";
const provider = new GoogleAuthProvider();

function showTip(msg, dur=2500){
  tipBoxEl.innerText = msg;
  tipBoxEl.style.display = "block";
  setTimeout(()=>{tipBoxEl.style.display="none";}, dur);
}
function setLoading(show){
  loadingEl.style.display = show ? "flex" : "none";
}

themeBtn.addEventListener("click",()=>{
  document.body.classList.toggle("dark-mode");
  if(currentUser) renderChart(getFilteredData());
});

loginBtn.addEventListener("click",async ()=>{
  setLoading(true);
  try{
    const result = await signInWithPopup(auth, provider);
    currentUser = result.user;
    showTip("登入成功");
  }catch(err){
    console.error("登入錯誤",err);
    if(err.code === "auth/popup-blocked-by-browser"){
      showTip("瀏覽器攔截咗彈窗，請允許彈窗或用無痕分頁",3500);
    }else if(err.code === "auth/popup-closed-by-user"){
      showTip("你手動關閉咗登入彈窗");
    }else{
      showTip("登入失敗："+err.message,4000);
    }
  }finally{
    setLoading(false);
  }
});

logoutBtn.addEventListener("click",async ()=>{
  setLoading(true);
  try{
    await signOut(auth);
    showTip("已登出");
  }catch(e){
    showTip("登出異常："+e.message);
  }finally{
    setLoading(false);
  }
});

onAuthStateChanged(auth, async (user)=>{
  setLoading(true);
  currentUser = user;
  if(user){
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    addBillBox.classList.remove("hidden");
    chartBox.classList.remove("hidden");
    listBox.classList.remove("hidden");
    await loadBillData();
    fillMonthSelector();
  }else{
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    addBillBox.classList.add("hidden");
    chartBox.classList.add("hidden");
    listBox.classList.add("hidden");
    allBillData = [];
    selectedFilterMonth = "";
    monthFilterSelect.innerHTML = "";
    if(chartInstance){chartInstance.destroy();chartInstance=null;}
  }
  setLoading(false);
});

voiceBtn.addEventListener("click",()=>{
  if(!("webkitSpeechRecognition" in window)){
    showTip("瀏覽器唔支援語音辨識");
    return;
  }
  showTip("請講說話……");
  const SpeechRecognition = window.webkitSpeechRecognition;
  const recog = new SpeechRecognition();
  recog.lang = "zh-HK";
  recog.interimResults = false;
  recog.onresult = e=>{
    const text = e.results[0][0].transcript;
    billRemark.value = text;
    showTip("已錄入："+text);
  };
  recog.onerror = ()=>showTip("語音辨識失敗");
  recog.start();
});

submitBtn.addEventListener("click",async ()=>{
  if(!currentUser){showTip("請先登入");return;}
  const money = parseFloat(billMoney.value.trim());
  if(isNaN(money) || money<=0){showTip("請輸入正確金額");return;}
  setLoading(true);
  try{
    const now = new Date();
    const newRecord = {
      uid: currentUser.uid,
      type: billType.value,
      money: Number(money.toFixed(2)),
      classify: billClass.value,
      remark: billRemark.value.trim(),
      timestamp: now.getTime(),
      day: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`,
      timeStr: `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`
    };
    await push(ref(db,"bills/"+currentUser.uid), newRecord);
    billMoney.value = ""; billRemark.value = "";
    showTip("記錄儲存成功");
    await loadBillData();
    fillMonthSelector();
  }catch(err){
    showTip("寫入失敗："+err.message);
  }finally{
    setLoading(false);
  }
});

window.deleteRecord = async function(key){
  if(!currentUser) return;
  if(!confirm("確定要刪除呢條記錄？刪除之後冇得復原！")) return;
  setLoading(true);
  try{
    await remove(ref(db,"bills/"+currentUser.uid+"/"+key));
    showTip("已刪除");
    await loadBillData();
    fillMonthSelector();
  }catch(e){
    showTip("刪除失敗："+e.message);
  }finally{
    setLoading(false);
  }
};

window.openEditModal = function(item){
  editKeyInput.value = item.id;
  editType.value = item.type || "pay";
  editMoney.value = item.money || 0;
  editClass.value = item.classify || "其他";
  editRemark.value = item.remark || "";
  editModal.style.display = "block";
};

modalCloseBtn.addEventListener("click",()=>{
  editModal.style.display = "none";
});

modalSaveBtn.addEventListener("click",async ()=>{
  const key = editKeyInput.value.trim();
  if(!key) return;
  const money = parseFloat(editMoney.value);
  if(isNaN(money) || money <= 0){
    showTip("請輸入正確金額");
    return;
  }
  setLoading(true);
  try{
    await update(ref(db,"bills/"+currentUser.uid+"/"+key),{
      type: editType.value,
      money: Number(money.toFixed(2)),
      classify: editClass.value,
      remark: editRemark.value.trim()
    });
    editModal.style.display = "none";
    showTip("修改成功");
    await loadBillData();
    fillMonthSelector();
  }catch(err){
    showTip("修改失敗："+err.message);
  }finally{
    setLoading(false);
  }
});

async function loadBillData(){
  if(!currentUser) return;
  const queryRef = ref(db,"bills/"+currentUser.uid);
  const snap = await get(queryRef);
  allBillData = [];
  snap.forEach(child=>{
    const val = child.val();
    // 過濾損壞冇day嘅舊數據
    if(!val || !val.day) return;
    allBillData.push({id:child.key,...val});
  });
  renderList();
  renderChart(getFilteredData());
}

// ✅修復：增加安全判斷，跳過冇day嘅記錄
function fillMonthSelector(){
  const monthSet = new Set();
  allBillData.forEach(d=>{
    if(!d.day) return;
    const ym = d.day.substring(0,7);
    monthSet.add(ym);
  });
  const arr = Array.from(monthSet).sort().reverse();
  monthFilterSelect.innerHTML = `<option value="">全部月份</option>`;
  arr.forEach(ym=>{
    const opt = document.createElement("option");
    opt.value = ym;
    opt.innerText = ym;
    if(selectedFilterMonth === ym) opt.selected = true;
    monthFilterSelect.appendChild(opt);
  });
}

monthFilterSelect.addEventListener("change",()=>{
  selectedFilterMonth = monthFilterSelect.value;
  renderList();
  renderChart(getFilteredData());
});

function getFilteredData(){
  if(!selectedFilterMonth) return [...allBillData];
  return allBillData.filter(x=>{
    if(!x.day) return false;
    return x.day.substring(0,7) === selectedFilterMonth;
  });
}

function renderList(){
  const list = getFilteredData();
  billListEl.innerHTML = "";
  if(list.length===0){
    billListEl.innerHTML = "<div style='padding:14px;text-align:center;'>暫無記錄</div>";
    monthTotalText.innerText = "";
    return;
  }
  const group = {};
  let totalIncome = 0, totalPay = 0;
  list.forEach(it=>{
    if(!it.day) return;
    if(!group[it.day]) group[it.day]=[];
    group[it.day].push(it);
    if(it.type==="income") totalIncome += it.money;
    else totalPay += it.money;
  });
  const balance = totalIncome - totalPay;
  const dayCount = new Set(list.filter(i=>i.day).map(i=>i.day)).size;
  const avgDaily = dayCount > 0 ? (totalPay / dayCount) : 0;
  monthTotalText.innerText =
`📊統計｜總收入:$${totalIncome.toFixed(2)}｜總支出:$${totalPay.toFixed(2)}｜結餘:$${balance.toFixed(2)}｜平均每日開支:$${avgDaily.toFixed(2)}`;

  Object.keys(group).sort().reverse().forEach(day=>{
    const dayList = group[day];
    let dayIn=0, dayOut=0;
    const dayTitle = document.createElement("div");
    dayTitle.className = "list-group-title";
    dayTitle.innerText = "📅 "+day;
    billListEl.appendChild(dayTitle);
    dayList.forEach(row=>{
      if(!row.day) return;
      if(row.type==="income") dayIn+=row.money; else dayOut+=row.money;
      const itemDiv = document.createElement("div");
      itemDiv.className = "list-item";
      const sign = row.type==="income"?"+":"‑";
      const color = row.type==="income"?"#097038":"#c82423";
      itemDiv.innerHTML = `
      <div class="item-content">
        <div>${row.timeStr||""}｜${row.classify||"未分類"}</div>
        <div class="remark-text">${row.remark||"無備註"}</div>
        <div style="font-weight:bold;color:${color}">${sign}$${Number(row.money||0).toFixed(2)}</div>
      </div>
      <div class="item-btn-group">
        <button class="btn-edit" onclick='openEditModal(${JSON.stringify(row).replace(/'/g,"\\'")})'>編輯</button>
        <button class="btn-del" onclick="deleteRecord('${row.id}')">刪除</button>
      </div>`;
      billListEl.appendChild(itemDiv);
    });
    const daySum = document.createElement("div");
    daySum.className = "day-total";
    daySum.innerText = `當日小計：收入$${dayIn.toFixed(2)}｜支出$${dayOut.toFixed(2)}｜淨$${(dayIn-dayOut).toFixed(2)}`;
    billListEl.appendChild(daySum);
  });
}

function renderChart(data){
  if(chartInstance) chartInstance.destroy();
  let inSum=0, outSum=0;
  data.forEach(it=>{
    if(it.type==="income") inSum+=it.money; else outSum+=it.money;
  });
  const ctx = myChartCanvas.getContext("2d");
  const isDark = document.body.classList.contains("dark-mode");
  chartInstance = new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["總收入","總支出"],
      datasets:[{data:[inSum,outSum],backgroundColor:["#36d399","#f87272"]}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      plugins:{legend:{labels:{color:isDark?"#eee":"#111"}}}
    }
  });
}

function buildCSV(type){
  const exportList = getFilteredData();
  const header = `"日期","時間","收支類別","分類","金額","備註"\n`;
  let body = "";
  exportList.forEach(r=>{
    if(!r.day) return;
    const tp = r.type==="income"?"收入":"支出";
    body += `"${r.day}","${r.timeStr||""}","${tp}","${r.classify||""}","${Number(r.money||0).toFixed(2)}","${(r.remark||"").replace(/"/g,'""')}"\n`;
  });
  const csv = header + body;
  let blob;
  if(type==="utf8"){
    blob = new Blob([new Uint8Array([0xef,0xbb,0xbf]),csv],{type:"text/csv;charset=utf-8"});
  }else{
    blob = new Blob([csv],{type:"text/csv;charset=gbk"});
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = type==="utf8"?"帳單_utf8.csv":"帳單_big5.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
exportUtf8.addEventListener("click",()=>{
  if(getFilteredData().length===0){showTip("暫無數據");return;}
  buildCSV("utf8"); showTip("UTF‑8已下載");
});
exportBig5.addEventListener("click",()=>{
  if(getFilteredData().length===0){showTip("暫無數據");return;}
  buildCSV("big5"); showTip("Big5已下載，適合Excel打開");
});
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;}
body{background:#ffffff;color:#111;min-height:100vh;padding:14px;transition:background 0.3s,color 0.3s;}
body.dark-mode{background:#0b0b0b;color:#eee;}
.container{max-width:720px;margin:0 auto;}
.header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #cccccc;gap:8px;}
.dark-mode .header{border-color:#333;}
.btn{padding:12px 14px;border:none;border-radius:8px;cursor:pointer;font-size:15px;margin:3px 2px;min-height:44px;}
.btn-google{background:#4285f4;color:#fff;}
.btn-logout{background:#d93025;color:#fff;display:none;}
.btn-theme{background:#222;color:#fff;}
.dark-mode .btn-theme{background:#eee;color:#111;}
.btn-voice{background:#168860;color:#fff;}
.btn-csv-utf8{background:#2b5797;color:#fff;}
.btn-csv-big5{background:#673ab7;color:#fff;}
.btn-save{background:#28a745;color:#fff;width:100%;margin-top:8px;padding:13px;font-size:16px;min-height:48px;}
.btn-edit{background:#2196F3;color:#fff;border:none;border-radius:6px;padding:10px 12px;font-size:14px;min-height:42px;cursor:pointer;}
.btn-del{background:#dc3545;color:#fff;border:none;border-radius:6px;padding:10px 12px;font-size:14px;min-height:42px;cursor:pointer;}
.card{background:#f7f7f7;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #e4e4e4;}
.dark-mode .card{background:#1c1c1c;border-color:#333;}
.form-item{margin:14px 0;}
label{display:block;margin-bottom:6px;font-size:15px;}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #bbb;font-size:16px;background:#fff;color:#111;min-height:46px;}
.dark-mode input,.dark-mode select{background:#2a2a2a;color:#eee;border-color:#444;}
.operate-bar{margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.chart-box{height:300px;margin:16px 0;}
.list-group-title{font-weight:bold;margin:16px 0 8px 0;padding-bottom:6px;border-bottom:1px solid #ccc;font-size:16px;}
.dark-mode .list-group-title{border-color:#333;}
.day-total{padding:10px 12px;margin:8px 0;background:#e8f0fe;border-radius:8px;font-size:14px;}
.dark-mode .day-total{background:#242b38;}
.list-item{padding:12px;border-bottom:1px solid #eee;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start;}
.dark-mode .list-item{border-color:#2c2c2c;}
.item-content{flex:1;min-width:0;}
.remark-text{word-break:break-all;margin:4px 0;color:#555;}
.dark-mode .remark-text{color:#aaa;}
.item-btn-group{display:flex;gap:8px;flex-shrink:0;}

.loading{position:fixed;inset:0;background:rgba(0,0,0,0.75);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:9999;}
.tip-popup{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:8px;z-index:9998;display:none;max-width:92%;font-size:15px;}
.hidden{display:none;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:none;align-items:center;justify-content:center;padding:12px;}
.modal-box{width:100%;max-width:440px;background:#fff;border-radius:12px;padding:20px;}
.dark-mode .modal-box{background:#222;color:#eee;}
.modal-btn-row{display:flex;gap:10px;margin-top:16px;}
.modal-btn-row button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;min-height:46px;cursor:pointer;}
</style>
</head>
<body>
<div class="loading" id="loading">系統載入中……</div>
<div class="tip-popup" id="tipBox"></div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>修改帳目記錄</h3>
    <input type="hidden" id="editKeyInput">
    <div class="form-item">
      <label>類型</label>
      <select id="editType">
        <option value="income">收入</option>
        <option value="pay">支出</option>
      </select>
    </div>
    <div class="form-item">
      <label>金額</label>
      <input type="number" id="editMoney" min="0" step="0.01">
    </div>
    <div class="form-item">
      <label>分類</label>
      <select id="editClass">
        <option value="飲食">飲食</option>
        <option value="交通">交通</option>
        <option value="購物">購物</option>
        <option value="工資">工資</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-item">
      <label>備註</label>
      <input type="text" id="editRemark">
    </div>
    <div class="modal-btn-row">
      <button id="modalCloseBtn" style="background:#888;color:#fff;">取消</button>
      <button id="modalSaveBtn" style="background:#28a745;color:#fff;">儲存修改</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="header">
    <h2>個人記帳系統</h2>
    <div>
      <button class="btn btn-google" id="loginBtn">Google帳號登入</button>
      <button class="btn btn-logout" id="logoutBtn">登出</button>
      <button class="btn btn-theme" id="themeBtn">切換深淺模式</button>
    </div>
  </div>

  <div class="card hidden" id="addBillBox">
    <h3>新增收支記錄</h3>
    <div class="operate-bar">
      <button class="btn btn-voice" id="voiceBtn">🎤語音輸入</button>
      <button class="btn btn-csv-utf8" id="exportUtf8">匯出CSV(UTF‑8)</button>
      <button class="btn btn-csv-big5" id="exportBig5">匯出CSV(Big5 Excel)</button>
    </div>

    <div class="form-item">
      <label>📆月份篩選</label>
      <select id="monthFilterSelect">
        <option value="">全部月份</option>
      </select>
    </div>

    <div style="font-size:13px;color:#666;margin-bottom:10px;">示範語句：今日餐飲支出50蚊、人工收入8000</div>
    <div class="form-item">
      <label>類型</label>
      <select id="billType">
        <option value="income">收入</option>
        <option value="pay">支出</option>
      </select>
    </div>
    <div class="form-item">
      <label>金額</label>
      <input type="number" id="billMoney" placeholder="輸入金額" min="0" step="0.01">
    </div>
    <div class="form-item">
      <label>分類</label>
      <select id="billClass">
        <option value="飲食">飲食</option>
        <option value="交通">交通</option>
        <option value="購物">購物</option>
        <option value="工資">工資</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-item">
      <label>備註</label>
      <input type="text" id="billRemark" placeholder="簡單備註">
    </div>
    <button class="btn btn-save" id="submitBtn">儲存記錄</button>
  </div>

  <div class="card hidden" id="chartBox">
    <h3>收支統計</h3>
    <div class="chart-box">
      <canvas id="myChart"></canvas>
    </div>
    <div id="monthTotalText" style="margin-top:10px;font-size:15px;font-weight:bold;word-break:break-all;"></div>
  </div>

  <div class="card hidden" id="listBox">
    <h3>收支明細（按日期分組）</h3>
    <div id="billList"></div>
  </div>
</div>
</body>
</html>
