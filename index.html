<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>損益打平與收支記錄器</title>

<!-- Firebase v10 Compat CDN (適合單一 HTML 檔案直接運行) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<!-- 數據圖表庫 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f5f7fa; color: #333; min-height: 100vh; padding: 16px; }
.container { max-width: 680px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.header { display: flex; justify-content: space-between; align-items: center; }
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-danger { background: #ea4335; color: #fff; }
.btn-success { background: #34a853; color: #fff; width: 100%; margin-top: 12px; }
.form-group { margin-bottom: 12px; }
label { display: block; font-size: 14px; margin-bottom: 4px; color: #666; }
input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="card header">
    <h2>收支計算記錄器</h2>
    <div>
      <button id="loginBtn" class="btn btn-primary">Google 登入</button>
      <button id="logoutBtn" class="btn btn-danger hidden">登出</button>
    </div>
  </div>

  <div id="appBody" class="hidden">
    <!-- 新增紀錄表單 -->
    <div class="card">
      <h3>新增交易紀錄</h3>
      <div class="form-group" style="margin-top: 12px;">
        <label>類型</label>
        <select id="type">
          <option value="expense">支出 (-)</option>
          <option value="income">收入 (+)</option>
        </select>
      </div>
      <div class="form-group">
        <label>金額 (HKD)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.1">
      </div>
      <div class="form-group">
        <label>類別</label>
        <select id="category">
          <option value="餐飲">餐飲</option>
          <option value="交通">交通</option>
          <option value="購物">購物</option>
          <option value="固定成本">固定成本 (Break-even)</option>
          <option value="薪水">薪水</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>備註</label>
        <input type="text" id="note" placeholder="例如：午餐麥當勞">
      </div>
      <button id="saveBtn" class="btn btn-success">儲存紀錄</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="card">
      <h3>交易歷史明細</h3>
      <div id="recordList" style="margin-top: 12px;">載入中...</div>
    </div>
  </div>
</div>

<script>
// 使用你的 Firebase 配置項目
const firebaseConfig = {
  apiKey: "AIzaSyBFfgFYyh1AGvpBYHdRUtHsnBz6pawPZOI",
  authDomain: "break-even-record-calculation.firebaseapp.com",
  databaseURL: "https://break-even-record-calculation-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "break-even-record-calculation",
  storageBucket: "break-even-record-calculation.firebasestorage.app",
  messagingSenderId: "963032266930",
  appId: "1:963032266930:web:23f60bb6409e55f1e371ab",
  measurementId: "G-0RH7CCVNB6"
};

// 初始化
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

// DOM 元素
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const appBody = document.getElementById("appBody");
const saveBtn = document.getElementById("saveBtn");
const recordList = document.getElementById("recordList");

// Google 登入
loginBtn.addEventListener("click", () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert("登入失敗：" + err.message));
});

// 登出
logoutBtn.addEventListener("click", () => auth.signOut());

// 監聽登入狀態
auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    appBody.classList.remove("hidden");
    loadData();
  } else {
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    appBody.classList.add("hidden");
  }
});

// 儲存資料到 Realtime Database
saveBtn.addEventListener("click", () => {
  const amount = parseFloat(document.getElementById("amount").value);
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value;
  const note = document.getElementById("note").value.trim();

  if (isNaN(amount) || amount <= 0) {
    alert("請輸入有效的金額！");
    return;
  }

  const newRecord = {
    amount,
    type,
    category,
    note,
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    dateStr: new Date().toLocaleDateString()
  };

  db.ref("users/" + currentUser.uid + "/records").push(newRecord)
    .then(() => {
      document.getElementById("amount").value = "";
      document.getElementById("note").value = "";
    })
    .catch(err => alert("儲存失敗：" + err.message));
});

// 讀取資料
function loadData() {
  db.ref("users/" + currentUser.uid + "/records").on("value", snapshot => {
    recordList.innerHTML = "";
    const data = snapshot.val();
    if (!data) {
      recordList.innerHTML = "<p style='color:#888;'>暫無紀錄</p>";
      return;
    }

    Object.keys(data).reverse().forEach(key => {
      const item = data[key];
      const div = document.createElement("div");
      div.style.cssText = "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;";
      div.innerHTML = `
        <div>
          <strong>${item.category}</strong> <small>(${item.note || '無備註'})</small><br>
          <small style="color:#aaa">${item.dateStr}</small>
        </div>
        <div style="font-weight:bold; color: ${item.type === 'income' ? '#34a853' : '#ea4335'}">
          ${item.type === 'income' ? '+' : '-'} $${item.amount.toFixed(2)}
        </div>
      `;
      recordList.appendChild(div);
    });
  });
}
</script>
</body>
</html>
